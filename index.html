<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIMSISFO UNSIA — Design as Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/theme.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--f-body);
      background: var(--ice);
      color: var(--ink);
      min-height: 100vh;
    }

    .navbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--divider);
      padding: 14px 32px;
    }
    .nav-inner {
      max-width: 1320px; margin: 0 auto;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img.hima { width: 42px; height: 42px; object-fit: contain; }
    .brand img.univ { width: 42px; height: 42px; object-fit: contain; mix-blend-mode: multiply; transform: scale(1.14); }
    .brand h1 { font: 800 18px/1.2 var(--f-head); color: var(--navy); }

    .nav-tabs {
      display: flex; gap: 6px;
      background: #F1F5F9;
      padding: 4px; border-radius: 10px;
      border: 1px solid var(--divider);
    }
    .nav-tab {
      font: 700 13px var(--f-head);
      color: var(--sub); background: transparent; border: 0;
      padding: 7px 14px; border-radius: 7px; cursor: pointer; transition: .2s;
    }
    .nav-tab:hover { color: var(--navy); }
    .nav-tab.active { background: var(--grad-pill); color: #fff; }

    .gh-btn {
      padding: 8px 14px; border-radius: 10px;
      background: #FFFFFF; border: 1px solid var(--divider);
      color: var(--navy); font: 700 13px var(--f-head); text-decoration: none;
    }
    .gh-btn:hover { border-color: var(--cyan); color: #0891B2; }

    .container { max-width: 1320px; margin: 0 auto; padding: 32px 32px 72px; }

    .sec { margin-bottom: 44px; }
    .sec.hidden { display: none; }
    .sec-title {
      font: 800 20px var(--f-head); color: var(--navy);
      margin-bottom: 16px;
    }

    /* Project Card */
    .project-card {
      background: #FFFFFF;
      border: 1px solid var(--divider);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .04);
    }
    .proj-top {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
      margin-bottom: 20px;
    }
    .proj-info h4 { font: 800 20px var(--f-head); color: var(--navy); }
    .proj-meta { font-size: 13px; color: var(--sub); margin-top: 4px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 16px; border-radius: 10px;
      font: 700 13px var(--f-head); text-decoration: none;
      border: 1px solid var(--divider);
      background: #FFFFFF; color: var(--navy);
      cursor: pointer; transition: .2s;
    }
    .btn:hover { border-color: var(--cyan); color: #0891B2; }
    .btn.primary { background: var(--grad-pill); border: 0; color: #FFFFFF; }
    .btn.primary:hover { color: #FFFFFF; opacity: .95; }

    .exports-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .exp-item {
      background: var(--ice);
      border: 1px solid var(--divider);
      border-radius: 14px; overflow: hidden;
      transition: .2s;
    }
    .exp-item:hover { border-color: var(--cyan); transform: translateY(-2px); }
    .exp-thumb {
      aspect-ratio: 4/5; overflow: hidden;
      background: #E2E8F0; cursor: zoom-in;
      border-bottom: 1px solid var(--divider);
    }
    .exp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .exp-bar {
      padding: 10px 12px; background: #FFFFFF;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .exp-bar span { font: 600 12.5px var(--f-body); color: var(--navy); }
    .exp-dl {
      flex: none; white-space: nowrap;
      padding: 5px 10px; border-radius: 7px;
      background: #ECFEFF; color: #0891B2; border: 1px solid #A5F3FC;
      font: 700 11.5px var(--f-head); text-decoration: none;
    }
    .exp-dl:hover { background: var(--cyan); color: #FFFFFF; border-color: var(--cyan); }

    /* Templates Grid */
    .tpl-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;
    }
    .tpl-card {
      background: #FFFFFF;
      border: 1px solid var(--divider);
      border-radius: 18px; padding: 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .tpl-card h4 { font: 800 16px var(--f-head); color: var(--navy); }
    .tpl-card code { display: block; margin-top: 4px; font: 600 12px "JetBrains Mono", monospace; color: var(--sub); }

    /* Brand Assets & Palette */
    .asset-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px;
      margin-bottom: 20px;
    }
    .asset-box {
      background: #FFFFFF;
      border: 1px solid var(--divider);
      border-radius: 16px; padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .asset-stage {
      width: 56px; height: 56px; border-radius: 12px;
      background: var(--ice); border: 1px solid var(--divider);
      display: grid; place-items: center; padding: 8px; flex: none;
    }
    .asset-stage img { width: 100%; height: 100%; object-fit: contain; }
    .asset-info b { display: block; font: 700 14px var(--f-head); color: var(--navy); }
    .asset-info a {
      display: inline-block; margin-top: 4px;
      font: 700 12px var(--f-head); color: #0891B2; text-decoration: none;
    }

    .palette-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px;
    }
    .swatch-card {
      background: #FFFFFF;
      border: 1px solid var(--divider);
      border-radius: 14px; padding: 10px;
      cursor: pointer; transition: .2s;
    }
    .swatch-card:hover { border-color: var(--cyan); transform: translateY(-2px); }
    .swatch-color {
      height: 52px; border-radius: 8px; margin-bottom: 8px;
      border: 1px solid rgba(15, 23, 42, .08);
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 6px 8px;
      font: 700 11px "JetBrains Mono", monospace;
    }
    .swatch-card b { display: block; font: 700 13.5px var(--f-head); color: var(--navy); }
    .swatch-card span.role { font: 600 11px var(--f-body); color: var(--sub); }

    /* Lightbox Modal */
    .lightbox {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(15, 23, 42, .85);
      backdrop-filter: blur(8px);
      display: none; place-items: center; padding: 24px;
    }
    .lightbox.open { display: grid; }
    .lightbox img {
      max-width: min(92vw, 760px);
      max-height: 90vh;
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--navy); color: #fff;
      padding: 10px 18px; border-radius: 10px; font: 600 13px var(--f-body);
      opacity: 0; transition: .25s; pointer-events: none; z-index: 250;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-inner">
      <div class="brand">
        <img class="hima" src="assets/logo-himsisfo.png" alt="Logo HIMSISFO" />
        <img class="univ" src="assets/logo-universitas.jpg" alt="Logo UNSIA" />
        <h1>HIMSISFO UNSIA</h1>
      </div>

      <div class="nav-tabs">
        <button class="nav-tab active" data-tab="all">Semua</button>
        <button class="nav-tab" data-tab="projects">Projects</button>
        <button class="nav-tab" data-tab="templates">Templates</button>
        <button class="nav-tab" data-tab="assets">Assets</button>
      </div>

      <a class="gh-btn" href="https://github.com/himsisfo-unsia/design-as-code" target="_blank" rel="noopener">GitHub</a>
    </div>
  </header>

  <main class="container">

    <section class="sec" data-sec="projects">
      <h3 class="sec-title">Projects</h3>
      <div id="projects-list"></div>
    </section>

    <section class="sec" data-sec="templates">
      <h3 class="sec-title">Templates</h3>
      <div class="tpl-grid" id="templates-list"></div>
    </section>

    <section class="sec" data-sec="assets">
      <h3 class="sec-title">Brand Assets &amp; Palette</h3>
      <div class="asset-grid">
        <div class="asset-box">
          <div class="asset-stage"><img src="assets/logo-himsisfo.png" alt="Logo HIMSISFO" /></div>
          <div class="asset-info">
            <b>Logo HIMSISFO</b>
            <a href="assets/logo-himsisfo.png" download>Download</a>
          </div>
        </div>
        <div class="asset-box">
          <div class="asset-stage"><img src="assets/logo-universitas.jpg" alt="Logo UNSIA" /></div>
          <div class="asset-info">
            <b>Logo UNSIA</b>
            <a href="assets/logo-universitas.jpg" download>Download</a>
          </div>
        </div>
        <div class="asset-box">
          <div class="asset-stage" style="background:#0B1F3A;color:#22D3EE;font:900 18px var(--f-head)">PDF</div>
          <div class="asset-info">
            <b>Konsep Tema</b>
            <a href="assets/konsep-tema-hima-2026-2027.pdf" target="_blank">Buka PDF</a>
          </div>
        </div>
        <div class="asset-box">
          <div class="asset-stage" style="background:#FAF5FF;color:#9333EA;font:800 18px 'JetBrains Mono',monospace">{ }</div>
          <div class="asset-info">
            <b>config.json</b>
            <a href="assets/config.json" target="_blank">Lihat JSON</a>
          </div>
        </div>
      </div>

      <div class="palette-grid" id="palette-list"></div>
    </section>

  </main>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="Preview Poster" />
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const FALLBACK_CONFIG = {
      palette: {
        colors: [
          { role: "Primary", name: "Bright Cyan", hex: "#06B6D4", cssVar: "--cyan" },
          { role: "Secondary", name: "Electric Violet", hex: "#A855F7", cssVar: "--violet" },
          { role: "Tertiary", name: "Fresh Mint", hex: "#2DD4BF", cssVar: "--mint" },
          { role: "Accent", name: "Lime Pulse", hex: "#A3E635", cssVar: "--lime" },
          { role: "Dark Base", name: "Midnight Navy", hex: "#0B1F3A", cssVar: "--navy" },
          { role: "Light Base", name: "Ice White", hex: "#F8FAFC", cssVar: "--ice" },
          { role: "Text Dark", name: "Ink", hex: "#0F172A", cssVar: "--ink" },
          { role: "Text Secondary", name: "Slate", hex: "#475569", cssVar: "--sub" }
        ]
      },
      templates: [
        { id: "ig-feed-4x5", name: "Instagram Feed (4:5)", dimensions: "1080 × 1350 px", path: "templates/ig-feed-4x5/index.html" },
        { id: "ig-story-9x16", name: "Instagram Story (9:16)", dimensions: "1080 × 1920 px", path: "templates/ig-story-9x16/index.html" },
        { id: "banner-16x9", name: "Landscape Banner (16:9)", dimensions: "1920 × 1080 px", path: "templates/banner-16x9/index.html" }
      ],
      projects: [
        {
          id: "kunjungan-edukatif-bi",
          title: "Kunjungan Edukatif ke Bank Indonesia",
          eventDate: "05 November 2026",
          format: "IG 4:5 (1080 × 1350)",
          studioPath: "projects/kunjungan-edukatif-bi/index.html",
          exports: [
            { label: "Single Post", file: "projects/kunjungan-edukatif-bi/export/poster-single.png" },
            { label: "Slide 1", file: "projects/kunjungan-edukatif-bi/export/carousel-1.png" },
            { label: "Slide 2", file: "projects/kunjungan-edukatif-bi/export/carousel-2.png" },
            { label: "Slide 3", file: "projects/kunjungan-edukatif-bi/export/carousel-3.png" }
          ]
        }
      ]
    };

    const toast = (msg) => {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._h);
      t._h = setTimeout(() => t.classList.remove('show'), 2200);
    };

    async function loadConfig() {
      try {
        const res = await fetch('assets/config.json');
        if (!res.ok) throw new Error();
        return await res.json();
      } catch {
        return FALLBACK_CONFIG;
      }
    }

    function renderHub(cfg) {
      document.getElementById('projects-list').innerHTML = cfg.projects.map((p) => `
        <article class="project-card">
          <div class="proj-top">
            <div class="proj-info">
              <h4>${p.title}</h4>
              <div class="proj-meta">${p.eventDate} · ${p.format}</div>
            </div>
            <a class="btn primary" href="${p.studioPath}">Buka Studio</a>
          </div>
          <div class="exports-grid">
            ${p.exports.map((e) => `
              <div class="exp-item">
                <div class="exp-thumb" data-zoom="${e.file}">
                  <img src="${e.file}" alt="${e.label}" loading="lazy" />
                </div>
                <div class="exp-bar">
                  <span>${e.label}</span>
                  <a class="exp-dl" href="${e.file}" download>Download PNG</a>
                </div>
              </div>
            `).join('')}
          </div>
        </article>
      `).join('');

      document.getElementById('templates-list').innerHTML = cfg.templates.map((t) => `
        <div class="tpl-card">
          <div>
            <h4>${t.name}</h4>
            <code>${t.dimensions}</code>
          </div>
          <a class="btn" href="${t.path}">Buka</a>
        </div>
      `).join('');

      document.getElementById('palette-list').innerHTML = cfg.palette.colors.map((c) => {
        const isLight = c.hex.toUpperCase() === '#F8FAFC' || c.hex.toUpperCase() === '#A3E635';
        const txt = isLight ? '#0B1F3A' : '#FFFFFF';
        return `
          <div class="swatch-card" data-hex="${c.hex}">
            <div class="swatch-color" style="background:${c.hex};color:${txt}">
              <span>${c.hex}</span>
              <span>${c.cssVar}</span>
            </div>
            <b>${c.name}</b>
            <span class="role">${c.role}</span>
          </div>
        `;
      }).join('');

      const lb = document.getElementById('lightbox');
      const lbImg = document.getElementById('lightbox-img');
      document.querySelectorAll('[data-zoom]').forEach((el) => {
        el.addEventListener('click', () => {
          lbImg.src = el.dataset.zoom;
          lb.classList.add('open');
        });
      });
      lb.addEventListener('click', () => lb.classList.remove('open'));

      document.querySelectorAll('[data-hex]').forEach((el) => {
        el.addEventListener('click', () => {
          navigator.clipboard?.writeText(el.dataset.hex);
          toast(`✔ ${el.dataset.hex} disalin`);
        });
      });
    }

    document.querySelectorAll('.nav-tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.querySelectorAll('.sec').forEach((sec) => {
          sec.classList.toggle('hidden', tab !== 'all' && sec.dataset.sec !== tab);
        });
      });
    });

    loadConfig().then(renderHub);
  </script>
</body>
</html>
